<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="order your delicious chocolatechip cookies from rays bakery online in Abuja.">


    <title> Chocolatechip Cookies| Rays Delight</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff8f3;
            color: #4b2e24;
        }

        .product-page {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            display: flex;
            gap: 40px;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .product-image {
            width: 45%;
            border-radius: 15px;
        }

        .product-info {
            flex: 1;
        }

        .product-info h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .description {
            font-size: 17px;
            line-height: 1.6;
            color: #666;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            margin: 20px 0;
        }

        .quantity {
            width: 60px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .add-cart {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7b452c;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .add-cart:hover {
            background: #5e321f;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            color: #7b452c;
            text-decoration: none;
        }
        .orderbtn button{
          display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background:blue;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .orderbtn:hover button{
            background:blue;  
        }

        @media (max-width: 700px) {
            .product-card {
                flex-direction: column;
                padding: 20px;
            }

            .product-image {
                width: 100%;
            }

            .product-info {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="product-page">

        <div class="product-card">

            <img 
                src="chocolate chip.jpg"
                alt=" Chocolatechip Cookies"
                class="product-image"
            >

            <div class="product-info">

                <h1> Chocolatechip Cookies</h1>

                <p class="description">
                   Treat yourself to our delicious chocolate chip 
                   cookies,soft ,golden,and generously packed with
                   chocolate chips.Perfectly baked for a delightful
                   crunch and a sweet chocolatey bite in every mouthful.
                </p>

                <p class="price"  >Total:₦<span id="total">3,500.00</span></p>

                <label for="quantity">Quantity:</label>
                <input 
                    type="number" 
                    id="quantity"
                    class="quantity"
                    value="1"
                    min="1"
                ><p>Dozen(s)</p>

                <button class="add-cart" onclick=addToCart()>Add to cart</button>

                     
                

            </div>
            
            

        </div>
        <a class="orderbtn" href="order.html"><button>checkout Now</button></a>

        <a href="index.html" class="back-button">
            ← Back to menu
        </a>

    </div>
    <script>
                const quantityInput = document.getElementById("quantity");
                const totalSpan = document.getElementById("total");
                const price = 3500.00;
                
                quantityInput.addEventListener('input',function () {
                  const quantity = parseInt(quantityInput.value);
                  const amount = quantity * price;
                  totalSpan.textContent = amount.toLocaleString() });
                
              
                function addToCart() {
                  const quantity = parseInt(quantityInput.value);
                  //const size = document.getElementById("cakeSize").value; 
                //const flavour = document.getElementById("cakeFlavour").value;
                //const cakeMessage = document.getElementById("cakeMessage").value;
               // const specialInstructions = document.getElementById("specialInstructions").value;
                
                  const product = {
                    name: "Chocolatechip cookies",
                    quantity: quantity,
                    price: price,
                    //size: size,
                   // flavour: flavour,
                    //cakeMessage: cakeMessage,
                   // specialInstructions: specialInstructions,
                    total: quantity * price
                  };
                let cart = JSON.parse(localStorage.getItem("cart")) || [];
                const existingProduct = cart.find(item => item.name === product.name);
                if (existingProduct) {
                  existingProduct.quantity += quantity;
                  existingProduct.total = existingProduct.quantity * existingProduct.price;
                 // existingProduct.size = product.size;
                 // existingProduct.flavour=product.flavour; 
                 // existingProduct.cakeMessage = product.cakeMessage
                  //existingProduct.specialInstructions = product.specialInstructions;;

                } else {
                  cart.push(product);
                }
                localStorage.setItem("cart", JSON.stringify(cart));
                alert(quantity+"Dozen(s)"+ " Chocolatechip cookies(s) added to cart!");
                }

              </script>
            </body>
</html>

</body>
</html>

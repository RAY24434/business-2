<!DOCTYPE html>
<html>
  <head>

    <style>
      body{

        #cart{
          background-color: aquamarine;
          border:0px;
          padding: 0px;
          margin: 0px;
          position: relative;
          top:-75px;
          left:-7%;
        }
        .buttons button{
          
           background: blue;
           color:white;
           border:none;
           padding:12px 24px;
           border-radius:100px;
           font-size:16px;
           font-weight:600;
           cursor:pointer;
           transition:all 0.3s ease;}
           .buttons button:hover{
            transform:translateY(-2px);

          position: relative;

    </head>
    <body>
        <h1>Shortbread Cookies</h1>
        <img src="image (10).jpg" width="100%" >
        <h2><strong>Ingredients:</strong></h2>
        <p><ol><li>Unsalted butter</li><li>Powdered sugar</li><li>Vanilla extract</li><li>All-purpose flour</li><li>Salt: </li></ol><br>
        <h2>Allergens</h2>
        <p>Contains:<br><ul><li>wheat</li><li>milk</li></ul></p>
        <h4>price</h4>
        <p><label for="quantity">Quantity</label>
            <input type="text" id="quantity" name="quantity" min="1" value="1">
            <p>Total:£<span id="total">150.00</span></p></p>
        <a class="buttons" href="index.html"><button id="back">Back to menu</button></a>
        <a class="buttons" href="order.html"><button>checkout Now</button></a>
        <button id="cart" onclick="addToCart()"><img src="cart image.png" width="8%" height="10%"></button>
        <h6 id="carttext">Add to cart</h6>
            <script>
                const quantityInput = document.getElementById("quantity");
                const totalSpan = document.getElementById("total");
                const price = 150.00;
                
                quantityInput.addEventListener('input',function () {
                  const quantity = parseInt(quantityInput.value);
                  const amount = quantity * price;
                  total.textContent = amount.toLocaleString() });
                
              
                function addToCart() {
                  const quantity = parseInt(quantityInput.value);
                  const product = {
                    name: "Shortbread Cookies",
                    quantity: quantity,
                    price: price,
                    total: quantity * price
                  };
                let cart = JSON.parse(localStorage.getItem("cart")) || [];
                const existingProduct = cart.find(item => item.name === product.name);
                if (existingProduct) {
                  existingProduct.quantity += quantity;
                  existingProduct.total = existingProduct.quantity * existingProduct.price;
                } else {
                  cart.push(product);
                }
                localStorage.setItem("cart", JSON.stringify(cart));
                alert(quantity+ " Shortbread Cookies(s) added to cart!");
                }
                function removeFromCart(productId) {
                  let cart = JSON.parse(localStorage.getItem("cart")) || [];
                  cart = cart.filter(item => item.id !== productId);
                  localStorage.setItem("cart", JSON.stringify(cart));
                  alert("Cart cleared!");
                }

              </script>
            </body>

            .image-container{

            }

                height:250px;
                object-fit:cover;
                border-radius:10px;
                display:block;
            }
            @media(max-width:600px){
                .image-container{
                    grid-template-columns: 1fr;
                    gap:15px;padding:10px;
                }

                }

                 margin-left:150px;

                    margin-left:150px;

                    }
